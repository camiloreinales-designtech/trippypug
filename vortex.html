<style>
/* Layout: a full-bleed WebGL loop corridor under a quiet four-corner HUD; a painting opens as a two-column page on the same gallery white. */
:root {
  --paper: #f6f6f3;
  --ink: #141413;
  --muted: #6c6c67;
  --line: #d8d8d2;
  --card: #ffffff;
  --sold: #d4343e;
  --focus: #ff3b6b;
  --display: "Archivo Narrow", "Helvetica Neue", "Arial Narrow", Arial, sans-serif;
  --ui: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--ui); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.dragging { cursor: grabbing; }

.hud { position: fixed; z-index: 5; pointer-events: none; transition: opacity .35s ease; }
.hud.away { opacity: 0; }
.tl { top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); }
.tl img { width: clamp(92px, 12vw, 160px); display: block; }
.tr { top: calc(env(safe-area-inset-top, 0px) + 18px); right: max(16px, env(safe-area-inset-right, 0px)); }
.tr img { width: clamp(108px, 15vw, 200px); display: block; }
.eyebrow { font: 700 10px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.bl { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; font: 700 13px/1.2 var(--ui); }
.links { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font: 700 13px/1.2 var(--ui); }
.links a, .tl a, .tr a { pointer-events: auto; color: var(--ink); text-decoration: none; display: block; }
.links a:hover { text-decoration: underline; }
.br { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 680px) {
  .bl { font-size: 12px; }
}

/* shop view */
.shop { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; opacity: 0; transition: opacity .45s ease; overscroll-behavior: contain; }
.shop.show { opacity: 1; }
.shop-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; padding-block: calc(env(safe-area-inset-top, 0px) + 10px) 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--paper); border-bottom: 1px solid var(--line); }
.logo-btn { background: none; border: 0; padding: 0; cursor: pointer; flex: none; }
.logo-btn img { height: 42px; width: auto; display: block; }
.crumb { flex: 1; min-width: 0; font: 700 10px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { flex: none; font: 700 10px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--ink); background: var(--ink); color: var(--card); border-radius: 999px; padding: 10px 14px; cursor: pointer; }
.shop-inner { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px calc(env(safe-area-inset-bottom, 0px) + 80px); }
.prod { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 76px); align-items: start; }
.pfig { margin: 0; position: sticky; top: 92px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
#pimg { display: block; width: min(100%, calc(72vh * var(--ar, 1))); height: auto; max-width: 100%; aspect-ratio: var(--ar, 1); object-fit: cover; background: var(--card); box-shadow: 0 22px 44px -26px rgba(20, 20, 19, .55); }
.pcap { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font: italic 400 14px/1.3 var(--serif); color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; font: 700 11px/1.3 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.pinfo { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.ptop { display: flex; flex-direction: column; gap: 10px; }
#ptitle { font: 700 clamp(32px, 4.4vw, 58px)/.94 var(--display); text-transform: uppercase; letter-spacing: -.005em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.by { font: italic 400 18px/1.2 var(--serif); color: var(--muted); margin: 0; }
.price { font: 700 22px/1.1 var(--ui); margin: 0; font-variant-numeric: tabular-nums; }
.price.sold { color: var(--sold); }
.facts { margin: 0; border-top: 1px solid var(--line); }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.facts dt { font: 700 10px/1.4 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font: 700 14px/1.4 var(--ui); text-align: right; min-width: 0; overflow-wrap: anywhere; }
a.add { display: flex; align-items: center; justify-content: center; text-decoration: none; padding-inline: 12px; text-align: center; }
.buyrow { display: flex; flex-direction: column; gap: 10px; }
a.add.alt { background: var(--card); color: var(--ink); border: 1px solid var(--ink); }
.note { margin: 0; font: 400 12px/1.4 var(--ui); color: var(--muted); }
.add { flex: 1; min-height: 50px; background: var(--ink); color: var(--card); border: 0; font: 700 12px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
.more { margin-top: 80px; display: flex; flex-direction: column; gap: 20px; }
.more h2 { font: 700 clamp(24px, 2.8vw, 32px)/1 var(--display); text-transform: uppercase; margin: 0; }
.mrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px; }
.mcard { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mcard .th { aspect-ratio: 1; display: grid; place-items: center; background: var(--card); }
.mcard img { max-width: 80%; max-height: 80%; display: block; box-shadow: 0 6px 14px -8px rgba(20, 20, 19, .5); }
.mcard b { font: 700 12px/1.3 var(--ui); overflow-wrap: anywhere; }
.mcard i { font: italic 400 13px/1 var(--serif); color: var(--muted); }
@media (max-width: 760px) {
  .prod { grid-template-columns: minmax(0, 1fr); }
  .pfig { position: static; }
  #pimg { width: min(100%, calc(56vh * var(--ar, 1))); }
  .crumb { display: none; }
  .shop-bar { justify-content: space-between; }
}
.fly { position: fixed; z-index: 30; pointer-events: none; object-fit: cover; margin: 0; box-shadow: 0 22px 44px -26px rgba(20, 20, 19, .55); }
.nogl { position: fixed; inset: 0; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; font: 700 15px/1.5 var(--ui); }
@media (prefers-reduced-motion: reduce) { .shop { transition: none; } }

      v.copy(it.center).addScaledVector(it.right, sx * it.w / 2); v.y += sy * it.h / 2; v.project(cam);
      const X = (v.x + 1) / 2 * innerWidth, Y = (1 - v.y) / 2 * innerHeight;
      x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y);
    }
    return { left: x0, top: y0, width: x1 - x0, height: y1 - y0 };
  }

  // ---------- painting view ----------
  const shop = $("shop"), pimg = $("pimg");
  const MAIL = "trippypuginfo@gmail.com";
  let buyMsg = "";
  $("pmail").addEventListener("click", () => tpTrack("buy_click", { painting: current.p.title, method: "email", gallery: "vortex" }));
  $("pig").addEventListener("click", () => {   // Instagram can't be pre-filled: copy the message so it can be pasted in the chat
    tpTrack("buy_click", { painting: current.p.title, method: "instagram", gallery: "vortex" });
    try { navigator.clipboard.writeText(buyMsg).then(() => { $("pnote").hidden = false; }, () => {}); } catch (e) {}
  });
  function renderMore(it) {
    let list = it.g.arts.filter(x => x !== it);
    if (list.length < 3) list = list.concat(items.filter(x => x !== it && !list.includes(x)).slice(0, 6 - list.length));
    $("moreT").textContent = list.every(x => x.g === it.g) ? "More from " + it.g.title : "More paintings";
    $("more").replaceChildren(...list.slice(0, 8).map(x => {
      const b = document.createElement("button"); b.type = "button"; b.className = "mcard";
      const th = document.createElement("span"); th.className = "th"; const im = document.createElement("img"); im.alt = ""; im.loading = "lazy"; im.src = x.p.thumb; th.appendChild(im);
      const t = document.createElement("b"); t.textContent = x.p.title; const y = document.createElement("i"); y.textContent = x.p.year + (x.p.sold ? " · sold" : "");
      b.append(th, t, y); b.addEventListener("click", () => { tpTrack("painting_view", { painting: x.p.title, gallery: "vortex" }); fillShop(x); zoomPose(x, cam); shop.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); }); return b;
    }));
  }
  function fillShop(it) {
    current = it; const p = it.p;
    $("crumb").textContent = "Vortex gallery  /  " + p.title;
    $("peye").textContent = p.year;
    $("ptitle").textContent = p.title;
    $("pby").textContent = "Trippy Pug";
    pimg.style.setProperty("--ar", (p.w / p.h).toFixed(4)); pimg.alt = p.alt || p.title; pimg.src = p.thumb;
    const full = new Image(); full.onload = () => { if (current === it) pimg.src = full.src; }; full.src = p.full;
    $("pfull").href = p.full;
    $("dMed").textContent = p.medium; $("dSize").textContent = p.dimensions; $("dYear").textContent = p.year;
    const st = $("pstatus"); st.textContent = p.sold ? "Sold" : (p.price || "Available"); st.classList.toggle("sold", !!p.sold);
    $("pbuy").hidden = !!p.sold; $("pnote").hidden = true;
    buyMsg = "Hi! I'm interested in \"" + p.title + "\" (" + p.year + ", " + p.medium + ", " + p.dimensions + "). Is it available?";
    $("pmail").href = "mailto:" + MAIL + "?subject=" + encodeURIComponent("I want to buy: " + p.title) + "&body=" + encodeURIComponent(buyMsg);
    renderMore(it);
  }
  function openShop(it, animate) {
    const from = projRect(it);
    fillShop(it); shop.hidden = false; shop.scrollTop = 0;
    const to = pimg.getBoundingClientRect();
    if (animate && !reduce && from.width > 4) {
      const fly = document.createElement("img"); fly.className = "fly"; fly.src = it.p.thumb; fly.alt = "";
      Object.assign(fly.style, { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" });
      document.body.appendChild(fly); pimg.style.visibility = "hidden";
      requestAnimationFrame(() => shop.classList.add("show"));
      fly.animate([
        { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" },
        { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px" }
      ], { duration: 700, easing: "cubic-bezier(.2,.7,.2,1)", fill: "forwards" }).finished.then(() => { pimg.style.visibility = ""; fly.remove(); });
    } else { requestAnimationFrame(() => shop.classList.add("show")); }
    mode = "shop"; $("back").focus({ preventScroll: true });
  }
  function closeShop() {
    if (shop.hidden) return;
    shop.classList.remove("show"); setTimeout(() => { shop.hidden = true; }, reduce ? 0 : 420);
    const q = sCur + wrapDiff(current.s - 2.6, sCur); sCur = sT = q; look = lookT = 0; hov = 0;
    walkPose(q, 0, tmp); mode = "return";
    tweenTo(tmp, 1.0, () => { mode = "walk"; document.querySelectorAll(".hud").forEach(h => h.classList.remove("away")); canvas.focus({ preventScroll: true }); });
  }
  $("back").addEventListener("click", closeShop); $("logoBack").addEventListener("click", closeShop); $("viewWall").addEventListener("click", closeShop);

  // ---------- loop ----------
  walkPose(sCur, 0, cam);
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
    if (document.hidden || mode === "shop") return;
    if (mode === "walk") {
      const moving = Math.abs(sT - sCur) > .05;
      sCur += (sT - sCur) * Math.min(1, dt * 3.2);
      if (moving && !drag) lookT *= Math.pow(.3, dt);
      look += (lookT + hov - look) * Math.min(1, dt * 5);
      walkPose(sCur, look, cam);
    } else if (tw) {
      tw.t = Math.min(1, tw.t + dt / tw.dur); const e = ease(tw.t);
      cam.position.lerpVectors(tw.p0, tw.p1, e); cam.quaternion.copy(tw.q0).slerp(tw.q1, e);
      if (tw.t >= 1) { const fn = tw.done; tw = null; if (fn) fn(); }
    }
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);
})();
</script>
