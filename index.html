<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DEFAULTS = { artist: "trippypug", medium: "Acrylic on canvas", dimensions: "" };

  /* ================= data ================= */
  let db = null, assets = null, user = null, canEdit = false, items = [];
  const state = { sel: null };

  /* ================= three.js room ================= */
  const canvas = $("gl");
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  } catch (e) { renderer = null; }
  if (!renderer || !window.THREE) { fallbackMode(); return startAll(); }

  let dirty = true;
  const PR = Math.min(innerWidth < 800 ? 1.5 : 2, devicePixelRatio || 1); renderer.setPixelRatio(PR);
  const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeeeeec);
  const camera = new THREE.PerspectiveCamera(62, 1, 0.05, 90); let baseFov = 62, zoom = 1;
  camera.rotation.order = "YXZ";
  let W = 13, L = 13; const HGT = 4, PER_ROOM = 1e9, IN = 0.0254, EYE = 1.6, ART_CY = 1.45;   // metres
  let roomIdx = 0, roomCount = 1, lastSwitch = 0;
  const room = new THREE.Group(), works = new THREE.Group();
  scene.add(room, works);
  scene.add(new THREE.AmbientLight(0xffffff, 0.42));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9a96, 0.22));

  const view = { x: 0, z: 0, yaw: 0, pitch: -0.02 };
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; baseFov = w / h < 0.8 ? 74 : 62; camera.fov = baseFov * zoom; camera.updateProjectionMatrix();
  }
  addEventListener("resize", () => { resize(); dirty = true; }); resize();

  const mats = {
    wall: new THREE.MeshStandardMaterial({ color: 0xe6e6e3, roughness: 1 }),
    floor: new THREE.MeshStandardMaterial({ color: 0x8e8e8a, roughness: .85 }),
    ceil: new THREE.MeshStandardMaterial({ color: 0xf2f2f0, roughness: 1 }),
    frame: new THREE.MeshStandardMaterial({ color: 0x0b0b0b, roughness: .5 }),
    metal: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .4 }),
    rail: new THREE.MeshStandardMaterial({ color: 0xd8d8d5, roughness: .6 }),
  };
  const shadowTex = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d"), gr = g.createRadialGradient(64, 64, 20, 64, 64, 64);
    gr.addColorStop(0, "rgba(0,0,0,.22)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })();

  // one painting per wall: back, left, right, front. Doors: next room (back wall, right), previous room (front wall, left).
  // Museum hang: 3 works per wall, the middle one centred on the wall, 3.4 m between centres, centres at 1.45 m (label sits to the right of each painting).
  // Tour order: left wall (front to back), back wall (left to right), right wall (back to front), front wall (right to left).
  // One room that grows: every wall has k slots (k = ceil(paintings / 4)), 3.4 m each plus margins, minimum 13 m. The room stays square so all four walls grow together.
  // Paintings are split evenly over the walls in tour order and sit centred on the slot grid, so a wall with fewer works is still symmetric.
  let SLOTS = [];
  function layoutRoom(n) {
    const k = Math.max(3, Math.ceil(n / 4)), len = Math.max(13, k * 3.4 + 2.8);
    W = L = len;
    const walls = [
      t => ({ x: -W / 2, z: -t, ry: Math.PI / 2, nx: 1, nz: 0 }),      // left, front to back
      t => ({ x: t, z: -L / 2, ry: 0, nx: 0, nz: 1 }),                 // back, left to right
      t => ({ x: W / 2, z: t, ry: -Math.PI / 2, nx: -1, nz: 0 }),      // right, back to front
      t => ({ x: -t, z: L / 2, ry: Math.PI, nx: 0, nz: -1 }),          // front, right to left
    ];
    SLOTS = [];
    walls.forEach((mk, w) => {
      const cnt = Math.floor(n / 4) + (w < n % 4 ? 1 : 0), off = (k - cnt) / 2;
      for (let j = 0; j < cnt; j++) { const t = (off + j + .5) * (len / k) - len / 2; SLOTS.push(mk(t)); }
    });
  }
  const DOOR_NEXT = { x: 5.6, z: -6.5 }, DOOR_PREV = { x: -5.6, z: 6.5 };
  const doorMeshes = [];

  function signTexture(text) {
    const c = document.createElement("canvas"); c.width = 512; c.height = 96;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 512, 96);
    g.fillStyle = "#111"; g.font = "700 46px Helvetica, Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 256, 50);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }

  function buildRoom() {
    room.children.slice().forEach(o => { room.remove(o); o.geometry && o.geometry.dispose(); if (o.userData.door !== undefined) { o.material.map && o.material.map.dispose(); } });
    dirty = true;
    doorMeshes.length = 0;
    const plane = (w, h, mat, pos, rot) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(...pos); m.rotation.set(...rot); room.add(m); return m; };
    plane(W, L, mats.floor, [0, 0, 0], [-Math.PI / 2, 0, 0]);
    plane(W, L, mats.ceil, [0, HGT, 0], [Math.PI / 2, 0, 0]);
    plane(W, HGT, mats.wall, [0, HGT / 2, -L / 2], [0, 0, 0]);
    plane(W, HGT, mats.wall, [0, HGT / 2, L / 2], [0, Math.PI, 0]);
    plane(L, HGT, mats.wall, [-W / 2, HGT / 2, 0], [0, Math.PI / 2, 0]);
    plane(L, HGT, mats.wall, [W / 2, HGT / 2, 0], [0, -Math.PI / 2, 0]);
    const box = (w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); room.add(m); return m; };
    const skirt = new THREE.MeshStandardMaterial({ color: 0xbdbdb9, roughness: 1 });
    box(W, .1, .02, skirt, 0, .05, -L / 2 + .01); box(W, .1, .02, skirt, 0, .05, L / 2 - .01);
    box(.02, .1, L, skirt, -W / 2 + .01, .05, 0); box(.02, .1, L, skirt, W / 2 - .01, .05, 0);
    // track rails
    box(W - 1.6, .04, .05, mats.rail, 0, HGT - .02, -L / 2 + 1.1);
    box(W - 1.6, .04, .05, mats.rail, 0, HGT - .02, L / 2 - 1.1);
    box(.05, .04, L - 1.6, mats.rail, -W / 2 + 1.1, HGT - .02, 0);
    box(.05, .04, L - 1.6, mats.rail, W / 2 - 1.1, HGT - .02, 0);
    const lx = W * .28; for (const x of [-lx, 0, lx]) for (const z of [-lx, 0, lx]) { const p = new THREE.PointLight(0xffffff, .42, W * .8, 1.4); p.position.set(x, HGT - .4, z); room.add(p); }
    // doorways
    const door = (pos, ny, target, label) => {
      const dm = new THREE.MeshBasicMaterial({ color: 0x000000, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 });
      const open = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 2.4), dm);
      open.position.set(pos.x, 1.2, pos.z + ny * .04); open.rotation.y = ny > 0 ? 0 : Math.PI; open.userData.door = target; room.add(open); doorMeshes.push(open);
      const sg = new THREE.Mesh(new THREE.PlaneGeometry(.8, .15), new THREE.MeshBasicMaterial({ map: signTexture(label) }));
      sg.position.set(pos.x, 2.7, pos.z + ny * .04); sg.rotation.y = ny > 0 ? 0 : Math.PI; sg.userData.door = target; room.add(sg); doorMeshes.push(sg);
    };
    if (roomIdx < roomCount - 1) door(DOOR_NEXT, 1, roomIdx + 1, `sala ${roomIdx + 2}  →`);
    if (roomIdx > 0) door(DOOR_PREV, -1, roomIdx - 1, `←  sala ${roomIdx}`);
  }

  const texCache = new Map(), loader = new THREE.TextureLoader();
  // huge uploads are shrunk to 2048 px on the long side: same look, a fraction of the GPU memory
  function shrink(t) {
    const im = t.image, m = Math.max(im.width || 0, im.height || 0);
    if (m <= 2048) return t;
    const k = 2048 / m, c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    t.image = c; t.needsUpdate = true; return t;
  }
  function getTex(url, cb) {
    if (texCache.has(url)) { const t = texCache.get(url); t.image ? cb(t) : t._cbs.push(cb); return; }
    const t0 = { _cbs: [cb] }; texCache.set(url, t0);
    loader.load(url, t => { t.encoding = THREE.sRGBEncoding; dirty = true; t.anisotropy = ANISO; t._keep = true; t._cbs = []; texCache.set(url, t); t0._cbs.forEach(f => f(t)); },
      undefined, () => { texCache.delete(url); });
  }

  function labelTexture(p) {
    const sans = '"Helvetica Neue", Helvetica, Arial, sans-serif', Wd = 820, pad = 10, maxW = Wd - pad * 2;
    const probe = document.createElement("canvas").getContext("2d");
    const wrap = (txt, font) => { probe.font = font; const out = []; let cur = ""; for (const w of String(txt).split(/\s+/)) { const t = cur ? cur + " " + w : w; if (probe.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; } out.push(cur); return out; };
    const ops = []; let y = pad;
    const add = (txt, font, color, lh, gapAfter = 0) => { for (const ln of wrap(txt, font)) { ops.push({ ln, font, color, y }); y += lh; } y += gapAfter; };
    add(p.artist || DEFAULTS.artist, `400 78px ${sans}`, "#151515", 92, 6);
    if (p.origin) add(p.origin, `400 44px ${sans}`, "#555", 58, 30); else y += 24;
    // bold title with the year in light weight on the same line
    const tfont = `700 48px ${sans}`, yfont = `400 44px ${sans}`;
    const tl = wrap(p.title || "Untitled", tfont);
    tl.forEach((ln, i) => {
      const last = i === tl.length - 1; ops.push({ ln, font: tfont, color: "#151515", y });
      if (last && p.year) ops.push({ ln: " " + p.year, font: yfont, color: "#333", y, after: ln, afont: tfont });
      y += 62;
    });
    if (p.medium) add(p.medium, `400 44px ${sans}`, "#333", 58);
    if (p.dimensions) add(p.dimensions, `400 44px ${sans}`, "#333", 58);
    if (!p.sold && p.price) { y += 16; add(p.price, `400 44px ${sans}`, "#333", 58); }
    const H = Math.ceil(y + pad);
    const c = document.createElement("canvas"); c.width = Wd; c.height = H;
    const g = c.getContext("2d"); g.textBaseline = "top";
    for (const o of ops) {
      g.font = o.font; g.fillStyle = o.color; let x = pad;
      if (o.after) { g.font = o.afont; x += g.measureText(o.after).width; g.font = o.font; }
      g.fillText(o.ln, x, o.y);
    }
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = ANISO; tex.userData = { ratio: Wd / H };
    return tex;
  }

  const buyTex = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const g = c.getContext("2d"); g.lineWidth = 9; g.strokeStyle = "#8c8c8c";
    g.beginPath(); g.arc(128, 128, 118, 0, Math.PI * 2); g.stroke();
    g.fillStyle = "#5e5e5e"; g.textAlign = "center"; g.textBaseline = "middle"; g.font = '700 38px "Helvetica Neue", Helvetica, Arial, sans-serif';
    ["i want", "to buy", "it"].forEach((t, i) => g.fillText(t, 128, 82 + i * 46));
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = ANISO; return t;
  })();
  const buyHit = [];
  const hit = [];   // clickable planes
  // "36" × 28"" -> [36, 28] inches (long side first). Missing sizes fall back to a 36 x 28 in canvas.
  const sizeIn = p => { const m = String(p.dimensions || "").match(/(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)/); const a = m ? +m[1] : 36, b2 = m ? +m[2] : 28; return [Math.max(a, b2), Math.min(a, b2)]; };
  function buildWorks() {
    works.children.slice().forEach(o => { works.remove(o); o.traverse(n => { if (n.geometry) n.geometry.dispose(); if (n.material && n.material.map && n.material.map.isCanvasTexture && !n.material.map._keep && n.material.map !== shadowTex && n.material.map !== buyTex) n.material.map.dispose(); }); });
    dirty = true;
    hit.length = 0; buyHit.length = 0;
    const newCount = Math.max(1, Math.ceil(items.length / PER_ROOM));
    if (roomIdx >= newCount) roomIdx = newCount - 1;
    const oldW = W; layoutRoom(items.length);
    const rebuild = newCount !== roomCount || !room.children.length || W !== oldW;
    roomCount = newCount;
    if (rebuild) buildRoom();
    updateNav();
    const here = items.slice(roomIdx * PER_ROOM, roomIdx * PER_ROOM + PER_ROOM);
    here.forEach((p, i) => {
      const s = SLOTS[i];
      const ratio = (p.w && p.h) ? p.w / p.h : 1.2, [longIn, shortIn] = sizeIn(p);
      const w = (ratio >= 1 ? longIn : shortIn) * IN, h = (ratio >= 1 ? shortIn : longIn) * IN;   // real size in metres
      const g = new THREE.Group();
      g.position.set(s.x + s.nx * 0.02, ART_CY, s.z + s.nz * 0.02); g.rotation.y = s.ry;
      const mat = new THREE.MeshBasicMaterial({ color: 0xdddddd });
      const pic = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); pic.position.z = .01; pic.userData.id = p.id; g.add(pic); hit.push(pic);
      getTex(p.assetId ? "/_blob/" + p.assetId : p.url, t => { mat.map = t; mat.color.set(0xffffff); mat.needsUpdate = true; });
      const lt = labelTexture(p), lw = .46, lh = lw / lt.userData.ratio;

      db.collection("paintings").orderBy("ts", "asc").onSnapshot(snap => {
        items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (renderer) { buildWorks(); refreshPanel(); } else renderFallback();
      }, () => {});
    })();
  }
  if (renderer) { buildRoom(); buildWorks(); view.z = L / 2 - .8; requestAnimationFrame(frame); startAll(); dolly(); }
})();
